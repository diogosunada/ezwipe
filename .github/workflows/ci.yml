name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Build the EZWipe boot ISO"
        type: boolean
        default: true

jobs:
  build-iso:
    # Manual: Actions > CI > Run workflow. Takes about 20 minutes.
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    needs: test-linux
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y live-build python3-pip python3-venv python3-setuptools python3-wheel
      - run: bash live/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ezwipe-iso
          path: build/live/*.iso
          compression-level: 0


  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -e .[dev]
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev] pyinstaller
      - name: Tests (includes read-only discovery on the runner's real disks)
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Read-only diagnostic on the runner
        run: python -m ezwipe.diag --out .
      - name: Build Windows executables
        run: pyinstaller --noconfirm --distpath dist packaging/ezwipe.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ezwipe-windows
          path: |
            dist/EZWipe.exe
            dist/EZWipe-Diagnostic.exe
            ezwipe-diagnostic-*.json
