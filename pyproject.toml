[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ezwipe"
version = "0.2.0"
description = "Data sanitization: bootable USB (Linux) and Windows 11 (NVMe, SATA, HDD, USB)"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4"]

[project.scripts]
ezwipe-diag = "ezwipe.diag.cli:main"

[project.gui-scripts]
ezwipe = "ezwipe.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
